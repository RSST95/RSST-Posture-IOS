name: Compiler RSST Posture pour iPhone

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Afficher la version de Xcode
        run: xcodebuild -version
      - name: Compiler pour le simulateur iPhone
        run: >
          xcodebuild -project RSSTPosture.xcodeproj -scheme RSSTPosture
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Compiler pour iPhone
        run: >
          xcodebuild -project RSSTPosture.xcodeproj -scheme RSSTPosture
          -configuration Release -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build
