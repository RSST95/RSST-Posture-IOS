name: Envoyer RSST Posture à TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsst-posture-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Signer et envoyer le build
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD \
                      APPLE_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configuration Apple manquante : $name"
              exit 1
            fi
          done
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || [[ ! "$ASC_KEY_ID" =~ ^[A-Z0-9]+$ ]]; then
            echo "::error::Vérifiez les identifiants d’équipe et de clé Apple."
            exit 1
          fi
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          if (( ${sdk%%.*} < 26 )); then
            echo "::error::L’envoi à Apple nécessite le SDK iOS 26 ou ultérieur."
            exit 1
          fi

          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/testflight.XXXXXX")"
          keychain="$scratch/signing.keychain-db"
          installed_profile=""
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; if [[ -n "$installed_profile" ]]; then rm -f "$installed_profile"; fi; rm -rf "$scratch"' EXIT

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$scratch/distribution.p12"
          printf '%s' "$APPLE_PROFILE_BASE64" | base64 -D > "$scratch/distribution.mobileprovision"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$scratch/Auth_$ASC_KEY_ID.p8"
          security cms -D -i "$scratch/distribution.mobileprovision" > "$scratch/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$scratch/profile.plist")"
          profile_app="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$scratch/profile.plist")"
          bundle_id=fr.rsst.posture.ios
          if [[ "$profile_app" != "$APPLE_TEAM_ID.$bundle_id" || ! "$profile_uuid" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
            echo "::error::Le profil Apple doit correspondre à fr.rsst.posture.ios et à l’équipe configurée."
            exit 1
          fi
          profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          installed_profile="$profiles_dir/$profile_uuid.mobileprovision"
          cp "$scratch/distribution.mobileprovision" "$installed_profile"

          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$scratch/distribution.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          xcodebuild -project RSSTPosture.xcodeproj -scheme RSSTPosture \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$scratch/RSSTPosture.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$profile_uuid" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive

          cat > "$scratch/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key><dict><key>$bundle_id</key><string>$profile_uuid</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$scratch/RSSTPosture.xcarchive" \
            -exportOptionsPlist "$scratch/ExportOptions.plist" -exportPath "$scratch/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$scratch/Auth_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
